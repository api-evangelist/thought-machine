- aid: thought-machine:vault-payments
  name: Thought Machine Vault Payments API
  description: >-
    Vault Payments is Thought Machine's cloud-native payments processing platform, able to run
    card, instant, batch clearing and cross-border payment types across schemes and regions.
    Payments are natively represented as ISO 20022 messages. The platform exposes RESTful APIs
    plus streaming APIs that push payment, product, payment-instrument and configuration data
    out in real time, and offers dynamic account routing that decouples payment instruments
    from funding sources. It runs standalone against a legacy core or pre-integrated with
    Vault Core. Base URLs are per-deployment and are not published publicly.
  humanURL: https://www.thoughtmachine.net/vaultpayments
