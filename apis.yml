aid: thought-machine
name: Thought Machine
description: 'Thought Machine is a London-headquartered cloud-native core banking technology
  company founded in 2014 by Paul Taylor, with offices in New York and Singapore. It builds
  Vault Core, a universal product engine in which every banking product — mortgages, loans,
  deposits, credit cards, wallets and Islamic finance products — is expressed as a developer-written
  smart contract executed against a real-time ledger, and Vault Payments, a cloud-native
  payments processing platform that natively represents payments as ISO 20022 messages and
  runs card, instant (FedNow, UK New Payments Architecture, SEPA Instant), batch clearing and
  cross-border rails. Both products are API-first: Vault Core exposes a REST Core API, a
  Posting API for financial movements, a Kafka-based Streaming API that emits accounting,
  balance and customer events in real time, a Migration API for legacy core data, and a
  Contracts API for smart-contract functions. Deployment is SaaS or bank-hosted on AWS, Azure,
  GCP, IBM Cloud, OpenShift or hybrid. Clients include Lloyds Banking Group, Standard Chartered
  (Mox), JPMorgan Chase, SEB, ING Poland, Intesa Sanpaolo, Kiwibank, Lunar and Judo Bank. The
  developer documentation and API reference are published behind a partner login at
  docs.thoughtmachine.net; a separate TM Sandbox API programme is available by application.'
