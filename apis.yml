apis:
- aid: thought-machine:vault-core
  name: Thought Machine Vault Core API
  description: >-
    Vault Core is Thought Machine's cloud-native core banking engine. Its API surface spans a
    REST Core API for external integrations (channels, CRM, operator UI), a Posting API that
    manages financial movements (authorisation, settlement, release of funds, credits and
    debits) against the real-time ledger, a Kafka-based Streaming API that emits accounting,
    balance and customer events, a Migration API optimised for bulk legacy-core data loads, and
    a Contracts API exposing the common functions available to smart contracts. Base URLs are
    per-deployment (SaaS tenant or bank-hosted cluster) and are not published publicly; the
    API reference is served behind a partner login.
  humanURL: https://www.thoughtmachine.net/vault-core
  tags:
  - Core Banking
  - Ledger
  - Smart Contracts
  - Account
  - Postings
  - Streaming
